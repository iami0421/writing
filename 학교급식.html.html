<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학교 급식 정보 조회</title>
  <style>
    :root {
      --primary-color: #4A90E2;
      --bg-color: #F4F7F9;
      --card-bg: #FFFFFF;
      --text-color: #333333;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 24px;
    }
    
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    
    header h1 {
      font-size: 1.5rem;
      color: var(--primary-color);
      margin-bottom: 6px;
    }
    
    .date-picker-area {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    
    input[type="date"] {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #DDD;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }
    
    button {
      padding: 10px 16px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    button:hover {
      background-color: #357ABD;
    }
    
    .meal-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    .meal-card {
      background-color: #F9FAFB;
      border-left: 4px solid var(--primary-color);
      padding: 16px;
      border-radius: 8px;
    }
    
    .meal-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 8px;
      color: #111;
    }
    
    .meal-content {
      line-height: 1.6;
      font-size: 0.95rem;
      color: #555;
      white-space: pre-wrap;
    }
    
    .status-msg {
      text-align: center;
      padding: 20px;
      color: #777;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🍱 오늘의 학교 급식</h1>
    <p style="font-size: 0.85rem; color: #888;">교육청 코드: N10 | 학교 코드: 8291021</p>
  </header>

  <div class="date-picker-area">
    <input type="date" id="mealDate">
    <button onclick="fetchMealData()">조회</button>
  </div>

  <div id="resultArea" class="meal-list">
    <div class="status-msg">날짜를 선택하고 조회해 주세요.</div>
  </div>
</div>

<script>
  const BACKEND_URL = "https://script.google.com/macros/s/AKfycbyxnSJDnL28JqKJ3zSzyNr5_GhRkWo6VKj81R6FIszsMWCwxhW3jmhtZoJguXQVpakZ/exec";

  // 페이지 로드시 오늘 날짜 자동 입력 및 식단 조회
  window.onload = () => {
    const today = new Date().toISOString().substring(0, 10);
    document.getElementById('mealDate').value = today;
    fetchMealData();
  };

  async function fetchMealData() {
    const rawDate = document.getElementById('mealDate').value;
    if (!rawDate) {
      alert("날짜를 선택해주세요.");
      return;
    }

    const formattedDate = rawDate.replace(/-/g, '');
    const resultArea = document.getElementById('resultArea');
    resultArea.innerHTML = `<div class="status-msg">급식 정보를 불러오는 중입니다...</div>`;

    try {
      const response = await fetch(`${BACKEND_URL}?date=${formattedDate}`);
      const data = await response.json();

      // 나이스 API 응답 검증 및 데이터 파싱
      if (data.mealServiceDietInfo) {
        const meals = data.mealServiceDietInfo[1].row;
        resultArea.innerHTML = '';
        
        meals.forEach(meal => {
          // 요리명 가공 (알레르기 정보 숫자 제거 및 태그 정제)
          const cleanDDISH = meal.DDISH_NM.replace(/<br\/>/g, '\n').replace(/\([0-9.]+\)/g, '');
          
          const card = document.createElement('div');
          card.className = 'meal-card';
          card.innerHTML = `
            <div class="meal-title">${meal.MMEAL_SC_NM}</div>
            <div class="meal-content">${cleanDDISH}</div>
            ${meal.CAL_INFO ? `<div style="margin-top: 8px; font-size: 0.8rem; color: #888;">열량: ${meal.CAL_INFO}</div>` : ''}
          `;
          resultArea.appendChild(card);
        });
      } else {
        resultArea.innerHTML = `<div class="status-msg">선택한 날짜에는 급식 정보가 없습니다.</div>`;
      }
    } catch (err) {
      console.error(err);
      resultArea.innerHTML = `<div class="status-msg" style="color: red;">급식 정보를 가져오는 중 오류가 발생했습니다.</div>`;
    }
  }
</script>

</body>
</html>
